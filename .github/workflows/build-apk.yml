name: Build Neurox Esports APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 typescript@5

      - name: Build web application
        run: npm run build -- --base=./

      - name: Initialize Capacitor
        run: |
          rm -f capacitor.config.ts capacitor.config.json
          npx cap init "Neurox Esports" "com.neurox.esports" --web-dir=dist

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/Neurox-Esports.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neurox-Esports-APK
          path: android/Neurox-Esports.apk
          if-no-files-found: error
