<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Deep Luxurious Esports Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="55%" stop-color="#0B101E" />
      <stop offset="100%" stop-color="#070A12" />
    </radialGradient>

    <!-- Neon Cyan Glow Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FF5D2" />
      <stop offset="50%" stop-color="#38D9A9" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Royal Gold Championship Gradient -->
    <linearGradient id="goldRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#FFD166" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Sword Blade Metallic Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Center Emblem Dark Shield Fill -->
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1B253B" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Soft Cyan Aura Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Gold Aura Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Base 1024x1024 Dark Background (#070A12) -->
  <rect width="1024" height="1024" rx="220" fill="#070A12" />
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)" />

  <!-- Subtle Cybernetic Grid & Radial Rings -->
  <g opacity="0.16" stroke="#4FF5D2" stroke-width="2">
    <circle cx="512" cy="460" r="390" stroke-dasharray="10 14" />
    <circle cx="512" cy="460" r="330" />
    <line x1="120" y1="460" x2="904" y2="460" stroke-opacity="0.5" />
    <line x1="512" y1="70" x2="512" y2="850" stroke-opacity="0.5" />
  </g>

  <!-- 2. Outer Luxury Gold Frame (#FFD166) -->
  <rect
    x="56"
    y="56"
    width="912"
    height="912"
    rx="185"
    fill="none"
    stroke="url(#goldRoyal)"
    stroke-width="16"
    filter="url(#goldGlow)"
  />

  <!-- Corner Gold Esports Accents -->
  <path d="M96 220 L96 140 Q96 96 140 96 L220 96" stroke="#FFD166" stroke-width="10" stroke-linecap="round" fill="none" />
  <path d="M928 220 L928 140 Q928 96 884 96 L804 96" stroke="#FFD166" stroke-width="10" stroke-linecap="round" fill="none" />
  <path d="M96 804 L96 884 Q96 928 140 928 L220 928" stroke="#FFD166" stroke-width="10" stroke-linecap="round" fill="none" />
  <path d="M928 804 L928 884 Q928 928 884 928 L804 928" stroke="#FFD166" stroke-width="10" stroke-linecap="round" fill="none" />

  <!-- 3. Inner Neon Cyan Frame (#4FF5D2) -->
  <rect
    x="92"
    y="92"
    width="840"
    height="840"
    rx="156"
    fill="none"
    stroke="url(#cyanNeon)"
    stroke-width="10"
    filter="url(#cyanGlow)"
  />

  <!-- 4. Crossed Esports Swords Behind Central Shield -->
  <g filter="url(#goldGlow)">
    <!-- Sword 1: Bottom-Left to Top-Right -->
    <g transform="translate(512, 435) rotate(42)">
      <!-- Blade -->
      <polygon points="0,-335 24,-250 18,130 -18,130 -24,-250" fill="url(#bladeGrad)" stroke="#4FF5D2" stroke-width="4" />
      <line x1="0" y1="-310" x2="0" y2="120" stroke="#070A12" stroke-width="4" opacity="0.45" />
      <!-- Crossguard (Gold) -->
      <path d="M-78,125 L78,125 L62,152 L-62,152 Z" fill="url(#goldRoyal)" stroke="#070A12" stroke-width="4" />
      <circle cx="0" cy="138" r="10" fill="#4FF5D2" />
      <!-- Grip -->
      <rect x="-13" y="152" width="26" height="78" rx="8" fill="#1B253B" stroke="#FFD166" stroke-width="5" />
      <!-- Pommel -->
      <circle cx="0" cy="246" r="22" fill="url(#goldRoyal)" stroke="#070A12" stroke-width="4" />
      <circle cx="0" cy="246" r="8" fill="#4FF5D2" />
    </g>

    <!-- Sword 2: Bottom-Right to Top-Left -->
    <g transform="translate(512, 435) rotate(-42)">
      <!-- Blade -->
      <polygon points="0,-335 24,-250 18,130 -18,130 -24,-250" fill="url(#bladeGrad)" stroke="#4FF5D2" stroke-width="4" />
      <line x1="0" y1="-310" x2="0" y2="120" stroke="#070A12" stroke-width="4" opacity="0.45" />
      <!-- Crossguard (Gold) -->
      <path d="M-78,125 L78,125 L62,152 L-62,152 Z" fill="url(#goldRoyal)" stroke="#070A12" stroke-width="4" />
      <circle cx="0" cy="138" r="10" fill="#4FF5D2" />
      <!-- Grip -->
      <rect x="-13" y="152" width="26" height="78" rx="8" fill="#1B253B" stroke="#FFD166" stroke-width="5" />
      <!-- Pommel -->
      <circle cx="0" cy="246" r="22" fill="url(#goldRoyal)" stroke="#070A12" stroke-width="4" />
      <circle cx="0" cy="246" r="8" fill="#4FF5D2" />
    </g>
  </g>

  <!-- 5. Central Hexagonal Esports Crest Shield -->
  <polygon
    points="512,175 745,285 745,545 512,675 279,545 279,285"
    fill="url(#shieldFill)"
    stroke="url(#goldRoyal)"
    stroke-width="14"
    stroke-linejoin="round"
  />
  <polygon
    points="512,202 720,300 720,530 512,645 304,530 304,300"
    fill="none"
    stroke="url(#cyanNeon)"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Championship Crown Above Brain -->
  <g transform="translate(512, 165)" filter="url(#goldGlow)">
    <path
      d="M-75,18 L-92,-38 L-38,-8 L0,-56 L38,-8 L92,-38 L75,18 Z"
      fill="url(#goldRoyal)"
      stroke="#070A12"
      stroke-width="6"
      stroke-linejoin="round"
    />
    <circle cx="-92" cy="-44" r="9" fill="#4FF5D2" />
    <circle cx="0" cy="-64" r="11" fill="#4FF5D2" />
    <circle cx="92" cy="-44" r="9" fill="#4FF5D2" />
  </g>

  <!-- 6. Glowing Cybernetic Brain Icon in Center of Shield -->
  <g transform="translate(512, 418)" filter="url(#cyanGlow)">
    <!-- Left Hemisphere -->
    <path
      d="M -12,-125
         C -75,-125 -130,-85 -138,-25
         C -158,-5 -162,40 -140,72
         C -135,118 -85,142 -35,135
         C -18,132 -12,118 -12,95 Z"
      fill="#111827"
      stroke="url(#cyanNeon)"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <!-- Right Hemisphere -->
    <path
      d="M 12,-125
         C 75,-125 130,-85 138,-25
         C 158,-5 162,40 140,72
         C 135,118 85,142 35,135
         C 18,132 12,118 12,95 Z"
      fill="#111827"
      stroke="url(#goldRoyal)"
      stroke-width="12"
      stroke-linejoin="round"
    />

    <!-- Left Neural Circuit Pathways (Cyan) -->
    <path
      d="M -12,-65 L -58,-65 L -88,-35
         M -12,-10 L -72,-10 L -102,22
         M -12,45 L -55,45 L -80,82
         M -58,-65 L -58,-10"
      fill="none"
      stroke="#4FF5D2"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="-88" cy="-35" r="11" fill="#FFD166" />
    <circle cx="-102" cy="22" r="11" fill="#4FF5D2" />
    <circle cx="-80" cy="82" r="11" fill="#FFD166" />

    <!-- Right Neural Circuit Pathways (Gold) -->
    <path
      d="M 12,-65 L 58,-65 L 88,-35
         M 12,-10 L 72,-10 L 102,22
         M 12,45 L 55,45 L 80,82
         M 58,-65 L 58,-10"
      fill="none"
      stroke="#FFD166"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="88" cy="-35" r="11" fill="#4FF5D2" />
    <circle cx="102" cy="22" r="11" fill="#FFD166" />
    <circle cx="80" cy="82" r="11" fill="#4FF5D2" />

    <!-- Central Core Synapse Bolt -->
    <line x1="0" y1="-132" x2="0" y2="115" stroke="#FFD166" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="-12" r="18" fill="#070A12" stroke="#4FF5D2" stroke-width="8" />
    <circle cx="0" cy="-12" r="7" fill="#FFD166" />
  </g>

  <!-- 7. NEUROX ESPORTS Typography Banner -->
  <g transform="translate(512, 745)">
    <!-- Nameplate Ribbon -->
    <rect
      x="-350"
      y="-68"
      width="700"
      height="132"
      rx="36"
      fill="#0B1120"
      stroke="url(#cyanNeon)"
      stroke-width="8"
      filter="url(#cyanGlow)"
    />
    <rect
      x="-336"
      y="-54"
      width="672"
      height="104"
      rx="26"
      fill="none"
      stroke="url(#goldRoyal)"
      stroke-width="3"
      opacity="0.85"
    />

    <!-- NEUROX Main Title -->
    <text
      x="0"
      y="20"
      text-anchor="middle"
      font-family="Arial Black, Impact, Arial, Helvetica, sans-serif"
      font-size="96"
      font-weight="900"
      letter-spacing="10"
      fill="#FFFFFF"
      stroke="#070A12"
      stroke-width="4"
    >
      NEURO<tspan fill="#4FF5D2">X</tspan>
    </text>
  </g>

  <!-- ESPORTS Gold Sub-Banner -->
  <g transform="translate(512, 858)">
    <rect
      x="-185"
      y="-30"
      width="370"
      height="54"
      rx="18"
      fill="url(#goldRoyal)"
      stroke="#070A12"
      stroke-width="5"
    />
    <text
      x="0"
      y="7"
      text-anchor="middle"
      font-family="Arial Black, Arial, Helvetica, sans-serif"
      font-size="30"
      font-weight="900"
      letter-spacing="9"
      fill="#070A12"
    >
      ESPORTS
    </text>
  </g>
</svg>
